<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Social links profile</title>
    <link href="styles.css" rel="stylesheet" />

    <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  </head>
  <body>
    <main>
      <div class="profile-card">
        <img
          src="./assets/images/avatar-jessica.jpeg"
          alt="Profile picture"
          class="profile-picture"
        />
        <div class="profile-info">
          <h1 class="profile-name">Jessica Randall</h1>
          <p class="profile-location">London, United Kingdom</p>
        </div>
        <p class="profile-bio">"Front-end developer and avid reader."</p>
        <ul class="profile-social-links">
          <li class="social-link"><a href="#">GitHub</a></li>
          <li class="social-link"><a href="#">Frontend Mentor</a></li>
          <li class="social-link"><a href="#">LinkedIn</a></li>
          <li class="social-link"><a href="#">Twitter</a></li>
          <li class="social-link"><a href="#">Instagram</a></li>
        </ul>
      </div>
    </main>
  </body>
</html>
